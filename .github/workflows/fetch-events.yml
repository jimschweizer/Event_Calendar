name: Fetch events twice daily

on:
  schedule:
    # Runs at 6:00 AM CDT (11:00 UTC) and 5:30 PM CDT (22:30 UTC)
    - cron: "0 11 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run fetch-events
        env:
          # Both optional — the corresponding source is skipped gracefully
          # (not a failure) if its secret isn't configured. See README.md
          # for how to obtain and add these.
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}

      - name: Commit updated events.json
        run: |
          git config user.name "aurora-events-bot"
          git config user.email "aurora-events-bot@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "chore: refresh events data"
          git push
