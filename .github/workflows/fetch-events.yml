name: Fetch events twice daily and deploy

on:
  schedule:
    # Runs at 6:17 AM CDT (11:17 UTC) and 5:23 PM CDT (22:23 UTC)
    # Off-peak minute configurations bypass congested queues for more reliable triggers
    - cron: "17 11 * * *"
    - cron: "23 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Fetch Events
        run: npm run fetch-events
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}

      - name: Commit updated events.json
        run: |
          git config user.name "aurora-events-bot"
          git config user.email "aurora-events-bot@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || (git commit -m "chore: refresh events data" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

