name: Fetch events twice daily and deploy

on:
  schedule:
    # Runs at 6:17 AM CDT (11:17 UTC) and 5:23 PM CDT (22:23 UTC)
    # Off-peak minute configurations bypass congested queues for more reliable triggers
    - cron: "17 11 * * *"
    - cron: "23 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Fetch Events
        run: npm run fetch-events
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}

      # Commit the regenerated data and push. A concurrent push (human commit,
      # another run) between our checkout and this push makes git reject the
      # push as non-fast-forward — in that case resync to the fresh tip and
      # regenerate ONCE from whatever code now lives on main, so the bot's data
      # is never generated from stale code, then push again. (Bash with -e: the
      # `if` guards the first failure so the else-branch can run.)
      - name: Commit and push updated events.json
        run: |
          git config user.name "aurora-events-bot"
          git config user.email "aurora-events-bot@users.noreply.github.com"
          commit_and_push() {
            git add data/events.json
            git diff --cached --quiet && { echo "No data changes to commit"; exit 0; }
            git commit -m "chore: refresh events data"
            git push
          }
          if commit_and_push; then
            echo "Push succeeded"
          else
            echo "Push rejected (main advanced mid-run) - resyncing and regenerating once"
            git fetch origin
            git reset --hard origin/main
            npm run fetch-events
            git add data/events.json
            git diff --cached --quiet && { echo "No data changes after resync"; exit 0; }
            git commit -m "chore: refresh events data"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

